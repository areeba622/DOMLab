<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DOMLab</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

  <!-- Preconnect speeds up the font fetch -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />


  <!-- index.html, inside <head>, before your fonts/links -->
  <script>
    (function () {
      const stored = localStorage.getItem('domlab-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.classList.toggle('dark', theme === 'dark');
    })();
  </script>



  <!-- Inter: UI chrome — weights 400 (body) & 600 (headers/labels) -->
  <!-- JetBrains Mono: tag names & data — weights 400 & 500 -->
<!-- index.html — update the Google Fonts link -->
<!-- index.html — update the Google Fonts link -->
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />
   

<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

  <!--display=swap: it tells the browser to show text immediately in a fallback font, then swap to the real font once it loads — so the user never sees invisible blank text while fonts are loading.-->
</head>
 <body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
